[package]
name = "dspd-ui"
description = "Control surface that is connected via network to the headless DSDP server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
gpui-kit = "0.7.3"
async-tungstenite = { version = "*", features = ["smol-runtime"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", features = ["blocking"] }
dspd-api.workspace = true
itertools = "0.15.0"
