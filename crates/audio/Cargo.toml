[package]
name = "dspd-audio"
description = "AudioBackend trait with offline (WAV), null and optional cpal backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Live I/O through WASAPI / CoreAudio / ALSA / JACK. Needs libasound2-dev on Linux.
cpal-backend = ["dep:cpal"]
jack-backend = ["dep:jack"]

[dependencies]
dspd-engine.workspace = true
anyhow.workspace = true
hound.workspace = true
rtrb.workspace = true
cpal = { workspace = true, optional = true }
jack = { version = "0.13", optional = true, features = ["controller"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["jack"], optional = true }

[dev-dependencies]
tempfile.workspace = true
dspd-plugin-gain.workspace = true
