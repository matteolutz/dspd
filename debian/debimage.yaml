{{- $mirror := or .mirror "http://deb.debian.org/debian" -}}
{{- $suite := or .suite "trixie" -}}
{{- $adminusername := or .adminusername "user" -}}
{{ $image := or .image (printf "debian-dspd-%s.img" $suite) }}

architecture: amd64

actions:
  - action: debootstrap
    suite: {{ $suite }}
    components:
      - main
      - non-free-firmware
    mirror: {{ $mirror }}
    variant: minbase

  - action: apt
    description: Install Kernel, GRUB and extra packages
    packages:
      - linux-image-rt-amd64
      - linux-headers-rt-amd64
      - sudo
      - adduser
      - openssh-server
      - zstd
      - systemd-sysv
      - util-linux
      - initramfs-tools
      - iproute2
      - network-manager
      - libnss-myhostname
      - grub-efi-amd64
      - grub-common
      - dosfstools

  - action: run
    description: Set up user
    chroot: true
    script: scripts/setup-user.sh {{ $adminusername }}

  - action: run
    description: Add hostname
    chroot: true
    command: echo dspd > /etc/hostname

  - action: image-partition
    imagename: {{ $image }}
    imagesize: 3GB
    partitiontype: gpt
    mountpoints:
      - mountpoint: /
        partition: root
      - mountpoint: /boot/efi
        partition: ESP
    partitions:
      - name: ESP
        fs: vfat
        start: 1MB
        end: 128MB
      - name: root
        fs: ext4
        start: 128MB
        end: 100%

  - action: filesystem-deploy
    description: Deploying filesystem onto image

  - action: run
    description: Install GRUB Bootloader
    chroot: true
    command: grub-install --target=x86_64-efi --efi-directory=/boot/efi --removable --no-nvram

  - action: run
    description: Update GRUB Menu
    chroot: true
    command: update-grub

  - action: run
    description: Compressing final image
    postprocess: true
    command: gzip -f {{ $image }}

  - action: run
    description: Extract bootloader u-boot.bin
    chroot: false
    command: cp ${ROOTDIR}/usr/lib/u-boot/libretech-cc/u-boot.bin ${ARTIFACTDIR}/u-boot.bin
